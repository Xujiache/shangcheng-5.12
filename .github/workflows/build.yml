# ----------------------------------------------------------------------------
# Build: 构建 server + 4 个前端（admin-pc / user-mp / merchant-app / platform-app）
#        并把产物作为 artifact 上传到本次 workflow run，方便手动取产物或对接发布。
#
# 触发：所有开发分支 push、PR 和手动运行。
#
# 产物分布：
#   - packages/server/dist            ← nest build（NestJS 后端）
#   - packages/shared/dist            ← tsup（共享层；server/前端都依赖）
#   - packages/admin-pc/dist          ← vite build（PC 后台）
#   - packages/user-mp/dist/build/h5  ← uni build（用户小程序的 H5 调试构建）
#   - packages/merchant-app/dist/build/h5
#   - packages/platform-app/dist/build/h5
#
# uni-app H5、微信资源包及 App 中间资源均构建；签名安装包、开发者工具运行、
# 真机和鸿蒙 SDK 构建由独立设备验收完成，不能用本工作流替代。
# ----------------------------------------------------------------------------
name: Build

on:
  push:
    branches: ['**']
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-server:
    name: Build server (NestJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @jiujiu/shared
        run: pnpm --filter @jiujiu/shared build

      - name: Generate Prisma client
        # nest build 引用了 @prisma/client，prisma generate 必须先跑
        run: pnpm --filter @jiujiu/server exec prisma generate

      - name: Build server
        run: pnpm --filter @jiujiu/server build

      - name: Upload server dist
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: packages/server/dist
          retention-days: 7

  build-admin-pc:
    name: Build admin-pc (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @jiujiu/shared
        run: pnpm --filter @jiujiu/shared build

      - name: Build admin-pc
        run: pnpm --filter @jiujiu/admin-pc build

      - name: Upload admin-pc dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-pc-dist
          path: packages/admin-pc/dist
          retention-days: 7

  build-uniapps:
    name: Build ${{ matrix.app }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - user-mp
          - merchant-app
          - platform-app
        target: [h5, app, mp-weixin]
        exclude:
          - app: platform-app
            target: mp-weixin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @jiujiu/shared
        run: pnpm --filter @jiujiu/shared build

      - name: Build ${{ matrix.app }} (${{ matrix.target }})
        run: pnpm --filter @jiujiu/${{ matrix.app }} build:${{ matrix.target }}

      - name: Upload ${{ matrix.app }} dist
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.target }}-dist
          # uni-app 默认 H5 产物：dist/build/h5
          path: packages/${{ matrix.app }}/dist
          retention-days: 7
          if-no-files-found: error
