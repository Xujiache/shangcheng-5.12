<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹈鹕骑自行车的 2D 动画</title>
<style>
  :root {
    --navy: #17324d;
    --blue: #2d9cdb;
    --yellow: #ffc857;
    --coral: #f27d5d;
    --cream: #fff8e7;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    min-height: 100%;
  }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(circle at 18% 15%, rgba(255, 255, 255, 0.9), transparent 30%),
      linear-gradient(135deg, #d9f3fa 0%, #fff7df 100%);
    font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
  }

  .stage {
    position: relative;
    width: min(94vw, 1120px);
    aspect-ratio: 16 / 10;
    overflow: hidden;
    border: 10px solid rgba(255, 255, 255, 0.75);
    border-radius: 32px;
    background: #bfeaf6;
    box-shadow:
      0 30px 70px rgba(30, 67, 91, 0.24),
      0 0 0 1px rgba(255, 255, 255, 0.8) inset;
    isolation: isolate;
  }

  svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .cloud {
    animation: cloud-drift 18s linear infinite;
  }

  .cloud.cloud-two {
    animation-delay: -8s;
    animation-duration: 23s;
  }

  .cloud.cloud-three {
    animation-delay: -15s;
    animation-duration: 27s;
  }

  .rig {
    transform-box: fill-box;
    transform-origin: center;
    animation: ride-bob 0.78s ease-in-out infinite;
  }

  .pelican {
    transform-box: fill-box;
    transform-origin: center;
    animation: body-breathe 0.78s ease-in-out infinite;
  }

  .wing {
    transform-box: fill-box;
    transform-origin: 88% 18%;
    animation: wing-flutter 0.78s ease-in-out infinite;
  }

  .tail {
    transform-box: fill-box;
    transform-origin: 100% 50%;
    animation: tail-sway 0.78s ease-in-out infinite;
  }

  .beak {
    transform-box: fill-box;
    transform-origin: 12% 45%;
    animation: beak-talk 1.56s ease-in-out infinite;
  }

  .eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 3.9s linear infinite;
  }

  .leg-front,
  .leg-back,
  .crank {
    transform-box: fill-box;
    transform-origin: center;
    animation: pedal 0.78s linear infinite;
  }

  .leg-back {
    animation-direction: reverse;
  }

  .wheel {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 0.78s linear infinite;
  }

  .wheel-back {
    animation-direction: reverse;
  }

  .road-dash {
    animation: road-slide 1.56s linear infinite;
  }

  .bird {
    animation: bird-float 4.8s ease-in-out infinite;
  }

  .bird-two {
    animation-delay: -2.4s;
  }

  .spark {
    animation: sparkle 1.3s ease-in-out infinite;
  }

  .spark-two {
    animation-delay: -0.45s;
  }

  .spark-three {
    animation-delay: -0.9s;
  }

  @keyframes cloud-drift {
    from { transform: translateX(-80px); }
    to { transform: translateX(1120px); }
  }

  @keyframes ride-bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-7px) rotate(-0.5deg); }
  }

  @keyframes body-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2px) scale(1.012, 0.99); }
  }

  @keyframes wing-flutter {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    50% { transform: rotate(-7deg) translateY(2px); }
  }

  @keyframes tail-sway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(5deg); }
  }

  @keyframes beak-talk {
    0%, 72%, 100% { transform: rotate(0deg); }
    80% { transform: rotate(7deg); }
    88% { transform: rotate(-2deg); }
  }

  @keyframes blink {
    0%, 45%, 50%, 100% { transform: scaleY(1); }
    47%, 48% { transform: scaleY(0.08); }
  }

  @keyframes pedal {
    0% { transform: rotate(13deg); }
    50% { transform: rotate(-13deg); }
    100% { transform: rotate(13deg); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes road-slide {
    to { transform: translateX(-180px); }
  }

  @keyframes bird-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-9px); }
  }

  @keyframes sparkle {
    0%, 100% { opacity: 0.25; transform: scale(0.72); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-play-state: paused !important;
    }
  }
</style>
</head>
<body>
