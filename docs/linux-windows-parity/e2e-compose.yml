name: jiujiu-parity
services:
  postgres:
    image: postgres:16-alpine
    container_name: jiujiu-parity-postgres
    environment:
      POSTGRES_USER: parity
      POSTGRES_PASSWORD: ${PARITY_POSTGRES_PASSWORD:?set in private .env}
      POSTGRES_DB: ledger_parity_test
    ports: ['127.0.0.1:5544:5432']
    volumes: ['./data/postgres:/var/lib/postgresql/data']
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parity -d ledger_parity_test']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: jiujiu-parity-redis
    command: ['sh', '-c', 'redis-server --requirepass "$${PARITY_REDIS_PASSWORD}" --maxmemory 96mb --maxmemory-policy noeviction']
    environment:
      PARITY_REDIS_PASSWORD: ${PARITY_REDIS_PASSWORD:?set in private .env}
    ports: ['127.0.0.1:6399:6379']
    volumes: ['./data/redis:/data']
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$${PARITY_REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    container_name: jiujiu-parity-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${PARITY_MINIO_USER:?set in private .env}
      MINIO_ROOT_PASSWORD: ${PARITY_MINIO_PASSWORD:?set in private .env}
    ports: ['127.0.0.1:9300:9000', '127.0.0.1:9301:9001']
    volumes: ['./data/minio:/data']
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    image: ${PARITY_WORKER_IMAGE:?set candidate image in private .env}
    container_name: jiujiu-parity-api
    command: ['node', 'dist/main.js']
    working_dir: /app/server
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      NODE_ENV: test
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: '3000'
      DATABASE_URL: postgresql://parity:${PARITY_POSTGRES_PASSWORD}@postgres:5432/ledger_parity_test
      REDIS_URL: redis://:${PARITY_REDIS_PASSWORD}@redis:6379/1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${PARITY_MINIO_USER}
      S3_SECRET_KEY: ${PARITY_MINIO_PASSWORD}
      S3_BUCKET: jiujiu-parity-files
      CONVERSION_BUCKET: jiujiu-parity-conversions
      CONVERSION_FEATURE_ENABLED: 'true'
      CONVERSION_PASSWORD_KEY: ${PARITY_CONVERSION_PASSWORD_KEY}
      JWT_SECRET: ${PARITY_JWT_SECRET}
      CORS_ORIGIN: http://127.0.0.1:3013
    ports: ['127.0.0.1:3013:3000']
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    mem_limit: 512m
    pids_limit: 128
