services:
  worker:
    image: ${PARITY_WORKER_IMAGE:?set candidate image in private .env}
    container_name: jiujiu-parity-worker
    command: ['node', 'dist/workers/conversion.worker.js']
    working_dir: /app/server
    user: '1000:1000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://parity:${PARITY_POSTGRES_PASSWORD:?set in private .env}@postgres:5432/ledger_parity_test
      REDIS_URL: redis://:${PARITY_REDIS_PASSWORD:?set in private .env}@redis:6379/1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${PARITY_MINIO_USER:?set in private .env}
      S3_SECRET_KEY: ${PARITY_MINIO_PASSWORD:?set in private .env}
      S3_BUCKET: jiujiu-parity-files
      CONVERSION_BUCKET: jiujiu-parity-conversions
      CONVERSION_PASSWORD_KEY: ${PARITY_CONVERSION_PASSWORD_KEY:?set in private .env}
    volumes:
      - ./data/worker-tmp:/tmp:rw
    read_only: true
    mem_limit: 8g
    cpus: 2.0
    pids_limit: 512
    stop_grace_period: 45s
