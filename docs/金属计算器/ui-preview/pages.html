  /* 门窗利账 · 设计 token（浅色为主 · teal #0E7C66 · soft 圆角 · regular 密度）
   还原自 Claude Design theme.jsx。深色模式后置（P4）。 */
body {
  /* 背景 / 表面 */
  --bg: #ebf0ed;
  --bg-grad: radial-gradient(120% 80% at 50% -10%, #f4f8f5 0%, #e7eeea 65%);
  --surface: #ffffff;
  --surface-2: #f4f8f6;
  --surface-up: #ffffff;

  /* 文字 */
  --text: #15201c;
  --muted: #5c6b64;
  --faint: #94a19a;

  /* 线条 / 轨道 */
  --border: rgba(20, 32, 28, 0.08);
  --border-strong: rgba(20, 32, 28, 0.14);
  --track: rgba(20, 32, 28, 0.06);

  /* 主色 */
  --accent: #0e7c66;
  --accent-soft: #e0efe9;
  --accent-text: #0e7c66;
  --nav-bg: rgba(255, 255, 255, 0.9);

  /* 盈亏 */
  --profit: #0e7c66;
  --loss: #c8442b;

  /* 数据可视化 6 色 */
  --c1: #0e7c66;
  --c2: #4c9fbe;
  --c3: #dfa03a;
  --c4: #d2735a;
  --c5: #84a06a;
  --c6: #9488b8;

  /* 阴影 */
  --shadow: 0 1px 2px rgba(16, 40, 30, 0.05), 0 8px 24px rgba(16, 40, 30, 0.07);
  --shadow-soft: 0 1px 2px rgba(16, 40, 30, 0.05);

  /* 沉浸光感（鸿蒙 7 满配：20px 高斯磨砂 + 发光亮边 + 呼吸流光 + 3D 悬浮）*/
  --glass-card-bg: linear-gradient(160deg, rgba(255, 255, 255, 0.56) 0%, rgba(255, 255, 255, 0.36) 100%);
  --glass-nav-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.26) 100%);
  --glass-blur: blur(20px) saturate(165%);
  --glass-blur-strong: blur(24px) saturate(175%);
  --glass-border: rgba(255, 255, 255, 0.55);
  --glass-rim: rgba(255, 255, 255, 0.95);
  /* 发光边框/光晕色（随主色，后续 Phase2 可由背景自动提取覆盖）*/
  --lumin-glow: rgba(46, 180, 150, 0.5);
  --lumin-glow-soft: rgba(46, 180, 150, 0.22);

  /* 圆角（soft） */
  --r-card: 16px;
  --r-btn: 16px;
  --r-chip: 999px;
  --r-bar: 6px;

  /* 间距 / 行高（regular） */
  --pad: 18px;
  --gap: 16px;
  --row: 64px;

  /* 字体 */
  --font: -apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;

  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
}
.metal-page { min-height: 100vh; color: var(--text); }
.metal-body { padding: 12px 12px calc(28px + var(--safe-bottom, 0px)); }
.metal-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
.metal-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; padding: 0 14px; font-size: 14px; font-weight: 600; }
.metal-heading__note { color: var(--muted); font-size: 11px; font-weight: 400; }
.metal-number { font-variant-numeric: tabular-nums; }
.metal-note { color: var(--muted); font-size: 11px; line-height: 1.65; }
.metal-disclaimer { margin: 16px 4px 0; color: var(--muted); font-size: 11px; line-height: 1.65; }
.metal-link { color: var(--accent); font-size: 12px; }
.metal-btn { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 44px; margin: 0; padding: 0 12px; border: 1px solid var(--accent); border-radius: var(--r-btn); background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; line-height: 1.2; }
.metal-btn::after { border: none; }
.metal-btn--outline { background: #fff; color: var(--accent); border-color: #c5dcd2; }
.metal-btn--plain { min-height: 40px; padding: 0 8px; background: transparent; border: 0; color: var(--accent); font-size: 12px; font-weight: 400; }
.metal-btn--danger { color: #ad5348; }
.metal-btn[disabled] { border-color: #e0e7e3; background: #e8eeeb; color: #8c9c94; }
.metal-tabs { display: flex; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.85); }
.metal-tabs__item { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; position: relative; min-height: 46px; color: var(--muted); font-size: 14px; }
.metal-tabs__item.is-active { color: var(--accent); font-weight: 600; }
.metal-tabs__item.is-active::after { content: ''; position: absolute; bottom: 0; left: 35%; right: 35%; height: 3px; border-radius: 3px; background: var(--accent); }
.metal-tabs__count { font-size: 11px; font-weight: 400; }
.metal-dock { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + var(--safe-bottom, 0px)); border-top: 1px solid #dce7e1; background: #f8fbf9; }
.metal-dock__buttons { display: flex; gap: 10px; }
.metal-dock__buttons .metal-btn { flex: 1; }
.metal-empty { padding: 38px 22px; text-align: center; }
.metal-empty__title { display: block; color: var(--text); font-size: 16px; font-weight: 600; }
.metal-empty__note { display: block; max-width: 270px; margin: 8px auto 18px; color: var(--muted); font-size: 12px; line-height: 1.7; }
.metal-empty .metal-btn { width: 150px; margin: 0 auto; }
.lz-hd {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-left: 18px;
  padding-right: 18px;
  padding-bottom: 12px;
  min-height: 44px;
}
/* 液态玻璃标题栏：半透明渐变镜面 + 顶部高光边（关闭则透明、沿用页面渐变背景）*/
.lz-hd--glass {
  background: var(--glass-nav-bg);
  -webkit-backdrop-filter: var(--glass-blur-strong);
  backdrop-filter: var(--glass-blur-strong);
  border-bottom: 1px solid var(--glass-border);
  box-shadow:
    inset 0 1px 0 var(--glass-rim),
    0 6px 18px rgba(8, 24, 18, 0.06);
}
.lz-hd__back {
  width: 38px;
  height: 38px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.lz-hd__titles {
  flex: 1;
  min-width: 0;
}
.lz-hd__title {
  font-size: 19px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
  line-height: 1.15;
}
.lz-hd__title--lg {
  font-size: 26px;
}
.lz-hd__sub {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px;
}
.lz-hd__right {
  flex-shrink: 0;
  display: flex;
  align-items: center;
}

etal-empty\">\u003ctext class=\"metal-empty__title\">先添加一项材料\u003c/text>\u003ctext class=\"metal-empty__note\">计算页选择材质、填写尺寸，点击“加入报价单”即可添加。\u003c/text>\u003cbutton class=\"metal-btn metal-btn--outline\" bindtap=\"openCalculator\">选择材料\u003c/button>\u003c/view>\n        \u003cview wx:else class=\"metal-quote__columns\">\u003ctext>材料 / 规格\u003c/text>\u003ctext>重量 / 金额\u003c/text>\u003c/view>\n        \u003cview wx:for=\"{{rows}}\" wx:key=\"index\" class=\"metal-quote__line\">\n          \u003cview class=\"metal-quote__line-head\">\u003ctext class=\"metal-quote__line-number\">{{index + 1}}\u003c/text>\u003ctext class=\"metal-quote__material\">{{item.material}}\u003c/text>\u003ctext class=\"metal-quote__amount metal-number\">¥{{item.amount}}\u003c/text>\u003c/view>\n          \u003ctext class=\"metal-quote__spec\">{{item.spec}}\u003c/text>\n          \u003cview class=\"metal-quote__line-meta\">\u003ctext class=\"metal-number\">{{item.weight}} kg\u003c/text>\u003ctext>吨价 ¥{{item.tonPrice}}\u003c/text>\u003cbutton wx:if=\"{{view === 'draft'}}\" class=\"metal-btn metal-btn--plain metal-btn--danger\" data-index=\"{{item.index}}\" bindtap=\"removeLine\">移除\u003c/button>\u003c/view>\n          \u003cview wx:if=\"{{item.factor !== '1.00' || item.fee !== '0.00'}}\" class=\"metal-quote__fee\">系数 {{item.factor}} 倍 · 加工费 ¥{{item.fee}}\u003c/view>\n        \u003c/view>\n      \u003c/view>\n      \u003cview wx:if=\"{{view === 'draft'}}\" class=\"metal-quote__policy metal-note\">保存时按后台价格重新计算；手填吨价仅用于计算页速算。\u003c/view>\n      \u003cview wx:if=\"{{view === 'saved'}}\" class=\"metal-quote__saved-tools\">\u003ctext class=\"metal-note\">可生成图片或 CSV 文件，生成后点击分享。\u003c/text>\u003cbutton class=\"metal-btn metal-btn--plain metal-btn--danger\" disabled=\"{{busy}}\" bindtap=\"deleteSaved\">删除报价单\u003c/button>\u003c/view>\n    \u003c/block>\n\n    \u003cblock wx:if=\"{{view === 'history'}}\">\n      \u003cview class=\"metal-quote__list-caption\">\u003ctext>云端报价记录\u003c/text>\u003ctext>会员到期后仍可查看\u003c/text>\u003c/view>\n      \u003cview wx:if=\"{{quotesError}}\" class=\"metal-quote__error metal-panel\">\u003ctext>报价单加载失败，请重试\u003c/text>\u003cbutton class=\"metal-btn metal-btn--plain\" bindtap=\"loadQuotes\">重试\u003c/button>\u003c/view>\n      \u003cview wx:if=\"{{loadingQuotes && !saved.length}}\" class=\"metal-panel metal-quote__loading\">正在加载报价单…\u003c/view>\n      \u003cview wx:elif=\"{{!saved.length && !quotesError}}\" class=\"metal-panel metal-empty\">\u003ctext class=\"metal-empty__title\">还没有已保存的报价单\u003c/text>\u003ctext class=\"metal-empty__note\">在当前报价中添加材料并保存后，记录会同步到这里。\u003c/text>\u003cbutton class=\"metal-btn metal-btn--outline\" bindtap=\"showDraft\">新建报价单\u003c/button>\u003c/view>\n      \u003cview wx:if=\"{{saved.length}}\" class=\"metal-panel metal-quote__saved-list\">\n        \u003cview wx:for=\"{{saved}}\" wx:key=\"id\" class=\"metal-quote__saved\" data-id=\"{{item.id}}\" bindtap=\"openSaved\" hover-class=\"tap-active\">\u003cview class=\"metal-quote__saved-head\">\u003ctext>{{item.title}}\u003c/text>\u003ctext class=\"metal-quote__amount metal-number\">¥{{item.amount}}\u003c/text>\u003c/view>\u003cview class=\"metal-quote__saved-meta\">\u003ctext>{{item.lineCount}} 项材料 · {{item.weight}} kg\u003c/text>\u003ctext>{{item.date}} \u003ctext class=\"metal-quote__chevron\">›\u003c/text>\u003c/text>\u003c/view>\u003c/view>\n      \u003c/view>\n      \u003cbutton wx:if=\"{{hasMore}}\" class=\"metal-btn metal-btn--plain metal-quote__load-more\" disabled=\"{{loadingQuotes}}\" bindtap=\"loadMore\">{{loadingQuotes ? '加载中…' : '加载更多报价单'}}\u003c/button>\n    \u003c/block>\n    \u003cview class=\"metal-disclaimer\">理论重量与报价仅供参考，实际以过磅和供货商报价为准。\u003c/view>\n  \u003c/view>\n  \u003cview wx:if=\"{{view !== 'history' && rows.length && !keyboardRaised}}\" class=\"metal-dock\">\n    \u003cview class=\"metal-quote__summary\">\u003cview>\u003ctext class=\"metal-note\">{{rows.length}} 项材料 · 总重量\u003c/text>\u003ctext class=\"metal-quote__summary-weight metal-number\">{{totalWeight}} \u003ctext>kg\u003c/text>\u003c/text>\u003c/view>\u003cview>\u003ctext class=\"metal-note\">{{view === 'draft' ? '预估合计' : '报价合计'}}\u003c/text>\u003ctext class=\"metal-quote__summary-price metal-number\">¥{{totalAmount}}\u003c/text>\u003c/view>\u003c/view>\n    \u003cview wx:if=\"{{view === 'draft'}}\" class=\"metal-dock__buttons\">\u003cbutton class=\"metal-btn metal-btn--outline\" disabled=\"{{busy}}\" bindtap=\"openCalculator\">继续添加\u003c/button>\u003cbutton class=\"metal-btn\" loading=\"{{busy}}\" disabled=\"{{busy}}\" bindtap=\"saveQuote\">保存报价单\u003c/button>\u003c/view>\n    \u003cview wx:else class=\"metal-dock__buttons\">\u003cbutton class=\"metal-btn metal-btn--outline\" disabled=\"{{busy}}\" bindtap=\"exportCsv\">生成 CSV\u003c/button>\u003cbutton class=\"metal-btn\" disabled=\"{{busy}}\" bindtap=\"exportImage\">生成图片\u003c/button>\u003c/view>\n    \u003cview wx:if=\"{{busy && view === 'saved'}}\" class=\"metal-quote__export-status\">正在处理，请稍候…\u003c/view>\n    \u003cview wx:if=\"{{view === 'saved' && (imagePath || csvPath)}}\" class=\"metal-quote__share\">\u003cbutton wx:if=\"{{imagePath}}\" class=\"metal-btn metal-btn--plain\" disabled=\"{{busy}}\" bindtap=\"shareImage\">分享图片\u003c/button>\u003cbutton wx:if=\"{{csvPath}}\" class=\"metal-btn metal-btn--plain\" disabled=\"{{busy}}\" bindtap=\"shareCsv\">分享 CSV\u003c/button>\u003c/view>\n  \u003c/view>\n  \u003ccanvas id=\"metalQuoteCanvas\" type=\"2d\" class=\"metal-quote__canvas\">\u003c/canvas>\n\u003c/view>\n\u003clz-route-feedback busy=\"{{_routeBusy}}\" slow=\"{{_routeSlow}}\" top=\"{{_routeTop}}\">\u003c/lz-route-feedback>\n"},"styles":{"index":"\n.metal-home__utility { display: flex; margin-bottom: 12px; }\n.metal-home__shortcut { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; min-height: 72px; padding: 12px 14px; }\n.metal-home__shortcut + .metal-home__shortcut { border-left: 1px solid var(--border); }\n.metal-home__shortcut-title { dis   function nodes(source,data){const result=document.createDocumentFragment();let matched=false;
