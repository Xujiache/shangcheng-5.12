  <title>量窗助手 · 更多工具设计</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="studio">
    <aside class="review-nav">
      <a class="studio-brand" href="#home"><span class="brand-mark">量</span><span>量窗助手<small>更多工具 · 交互设计稿</small></span></a>
      <nav aria-label="设计页面" id="review-pages"></nav>
      <div class="review-note"><span class="note-kicker">设计范围</span><p>首页入口、工具总览、四个工具详情及操作状态。</p><p>退休时间自动计算，本机记住信息。传感器读数、玻璃计算结果为演示数据。</p></div>
      <div class="source-link"><a href="overview.html">查看六页总览 ↗</a><br><br><a href="DESIGN.md">查看设计说明 ↗</a></div>

          <div class="home-indicator" aria-hidden="true"></div>
          <div id="toast" class="toast" role="status" aria-live="polite"></div>
          <div id="sheet-root"></div>
        </div>
        <div class="design-caption"><span id="caption"></span><small>可体验新增入口、表单、返回与弹层</small></div>
      </div>
    </main>
  </div>
  <script type="module" src="prototype.mjs"></script>
