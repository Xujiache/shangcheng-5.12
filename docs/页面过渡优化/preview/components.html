<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页面过渡 · 组件样式预览</title><style>
    *{box-sizing:border-box}body{margin:0;background:#f0f5f2;color:#233e33;font-family:"Microsoft YaHei",sans-serif}view,block{display:block}text{display:inline}
    header{padding:28px 20px 22px;background:#f7faf8}h1{margin:0 0 9px;font-size:22px;letter-spacing:.5px}header p{margin:0;font-size:12px;color:#84988c}
    nav{display:flex;gap:5px;margin:18px;background:#e3ebe6;padding:4px;border-radius:28px}button{flex:1;border:0;border-radius:24px;padding:10px 4px;color:#718779;background:transparent;font:inherit;font-size:12px;cursor:pointer}button[aria-pressed=true]{background:#fff;color:#1b4435;font-weight:700}
    main{padding:0 18px 24px}.caption{margin:20px 2px 14px;font-size:12px;color:#728a7c}.hint{padding:18px;color:#8a9b92;font-size:11px;line-height:1.8;text-align:center}
    .sk {
  position: relative;
  overflow: hidden;
  padding: 2px 0;
  color: #81988d;
}
.sk-card {
  position: relative;
  overflow: hidden;
  padding: 18px;
  margin-bottom: 12px;
  border: 1px solid #e6eee9;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.85);
}
.sk-card:last-child {
  margin-bottom: 0;
}
.sk-line,
.sk-avatar,
.sk-amount,
.sk-end,
.sk-input {
  background: linear-gradient(100deg, #e9f0eb, #f1f6f2);
  border-radius: 6px;
}
.sk-line {
  height: 10px;
  width: 100%;
}
.sk-short {
  width: 44%;
}
.sk-title {
  width: 66%;
  height: 13px;
}
.sk-subtitle {
  width: 44%;
  height: 8px;
  margin-top: 10px;
}
.sk-amount {
  width: 47%;
  height: 32px;
  margin: 23px 0 27px;
  border-radius: 8px;
}
.sk-stats {
  display: flex;
  gap: 24px;
  border-top: 1px solid #eff3ef;
  padding-top: 20px;
}
.sk-stats > view {
  flex: 1;
}
.sk-stats .sk-short {
  margin-top: 11px;
}
.sk-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.sk-copy {
  flex: 1;
  min-width: 0;
}
.sk-avatar {
  width: 38px;
  height: 38px;
  border-radius: 13px;
  flex-shrink: 0;
}
.sk-end {
  width: 42px;
  height: 13px;
}
.sk-bottom {
  margin-top: 20px;
  width: 86%;
  height: 7px;
}
.sk-input {
  height: 42px;
  margin-top: 16px;
  border-radius: 10px;
}
.sk--moving .sk-card::after,
.sk--inline.sk--moving::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 55%;
  pointer-events: none;
  background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.45), transparent);
  transform: translateX(-140%);
  animation: skShimmer 1.8s ease-in-out 160ms infinite;
}
.sk--inline {
  padding: 12px 0;
}
.sk-inline {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 11px;
}
.sk-inline .sk-line {
  width: 42px;
  height: 5px;
}
.sk--inline.sk--moving::after {
  width: 30%;
}
@keyframes skShimmer {
  0%,
  15% {
    transform: translateX(-140%);
  }
  85%,
  100% {
    transform: translateX(260%);
  }
}
@media (prefers-reduced-motion: reduce) {
  .sk--moving .sk-card::after,
  .sk--inline.sk--moving::after {
    animation: none;
    display: none;
  }
}

.route-feedback {
  position: fixed;
  left: 0;
  right: 0;
  z-index: 90;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition:
    opacity 140ms ease,
    visibility 140ms ease;
}
.route-feedback--visible {
  opacity: 1;
  visibility: visible;
}
.route-feedback__track {
  height: 2px;
  overflow: hidden;
  background: rgba(14, 124, 102, 0.06);
}
.route-feedback__light {
  height: 100%;
  width: 100%;
  border-radius: 8px;
  background: linear-gradient(90deg, transparent, #35ba97, #a5dec8);
}
.route-feedback--visible.route-feedback--moving .route-feedback__light {
  width: 32%;
  transform: translateX(-110%);
  animation: routeLight 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
.route-feedback__note {
  width: 126px;
  margin: 10px auto 0;
  padding: 8px 12px;
  border: 1px solid #e1eee7;
  border-radius: 24px;
  background: #f6fbf8;
  box-shadow: 0 4px 16px rgba(20, 85, 62, 0.06);
  color: #527768;
  font-size: 11px;
  text-align: center;
  opacity: 0;
  transition: opacity 180ms ease;
}
.route-feedback__note--visible {
  opacity: 1;
}
@keyframes routeLight {
  from {
    transform: translateX(-110%);
  }
  to {
    transform: translateX(420%);
  }
}
@media (prefers-reduced-motion: reduce) {
  .route-feedback,
  .route-feedback__note {
    transition: none;
  }
  .route-feedback--visible.route-feedback--moving .route-feedback__light {
    animation: none;
    transform: none;
    width: 100%;
    opacity: 0.6;
  }
}

/* Never transform a whole page: fixed footers, keyboards, sheets and canvas coordinates stay native. */
.lz-route-reveal-a {
  animation: lzRouteRevealA 220ms cubic-bezier(0.22, 1, 0.36, 1) backwards;
}
.lz-route-reveal-b {
  animation: lzRouteRevealB 220ms cubic-bezier(0.22, 1, 0.36, 1) backwards;
}
@keyframes lzRouteRevealA {
  from {
    opacity: 0.86;
  }
  to {
    opacity: 1;
  }
}
@keyframes lzRouteRevealB {
  from {
    opacity: 0.86;
  }
  to {
    opacity: 1;
  }
}
.lz-route-scene [hover-class] {
  -webkit-tap-highlight-color: transparent;
}
.tap-active {
  transition:
    transform 100ms ease-out,
    opacity 100ms ease-out;
}
@media (prefers-reduced-motion: reduce) {
  .lz-route-reveal-a,
  .lz-route-reveal-b {
    animation: none;
  }
  .lz-route-scene .tap-active {
    transform: none;
    transition: none;
  }
}

    </style><header><h1>轻柔加载，顺畅切换</h1><p>组件样式预览 · 非微信运行截图</p></header><nav id="variants"></nav><main><p class="caption" id="caption"></p><div id="stage"></div></main><div id="feedback"></div><div class="hint">使用项目中的真实组件模板与样式<br>原生导航、真机帧率及安全区仍需微信环境验收</div><script>
    const templates={"skeleton":"\u003cview class=\"sk sk--{{variant}} {{moving?'sk--moving':''}}\" aria-label=\"{{label}}\" aria-role=\"status\">\n  \u003cview wx:if=\"{{variant==='inline'}}\" class=\"sk-inline\">\n    \u003cview class=\"sk-line\">\u003c/view>\n    \u003ctext>{{label}}\u003c/text>\n  \u003c/view>\n  \u003cblock wx:else>\n    \u003cview wx:if=\"{{variant==='dashboard'||variant==='detail'}}\" class=\"sk-card sk-hero\">\n      \u003cview class=\"sk-line sk-short\">\u003c/view>\n      \u003cview class=\"sk-amount\">\u003c/view>\n      \u003cview class=\"sk-stats\">\n        \u003cview wx:for=\"{{rows}}\" wx:key=\"*this\">\n          \u003cview class=\"sk-line\">\u003c/view>\n          \u003cview class=\"sk-line sk-short\">\u003c/view>\n        \u003c/view>\n      \u003c/view>\n    \u003c/view>\n    \u003cview class=\"sk-card\" wx:for=\"{{rows}}\" wx:key=\"*this\">\n      \u003cview class=\"sk-row\">\n        \u003cview wx:if=\"{{variant!=='form'}}\" class=\"sk-avatar\">\u003c/view>\n        \u003cview class=\"sk-copy\">\n          \u003cview class=\"sk-line sk-title\">\u003c/view>\n          \u003cview class=\"sk-line sk-subtitle\">\u003c/view>\n        \u003c/view>\n        \u003cview wx:if=\"{{variant==='list'}}\" class=\"sk-end\">\u003c/view>\n      \u003c/view>\n      \u003cview wx:if=\"{{variant==='form'}}\" class=\"sk-input\">\u003c/view>\n      \u003cview wx:elif=\"{{variant!=='list'}}\" class=\"sk-line sk-bottom\">\u003c/view>\n    \u003c/view>\n  \u003c/block>\n\u003c/view>\n","feedback":"\u003cview class=\"route-feedback {{busy?'route-feedback--visible':''}} {{moving?'route-feedback--moving':''}}\" style=\"top:{{top}}px\" aria-hidden=\"{{!busy}}\">\n  \u003cview class=\"route-feedback__track\">\n    \u003cview class=\"route-feedback__light\">\u003c/view>\n  \u003c/view>\n  \u003cview class=\"route-feedback__note {{slow?'route-feedback__note--visible':''}}\">正在打开页面…\u003c/view>\n\u003c/view>\n"};
    const names={list:'订单列表',dashboard:'经营概览',detail:'订单详情',form:'编辑表单',inline:'追加加载'};
    const expr=(s,data)=>Function(...Object.keys(data),'return ('+s+');')(...Object.values(data));
    const text=(s,data)=>s.replace(/{{([\s\S]*?)}}/g,(_,x)=>String(expr(x,data)??''));
    function nodes(source,data){
      const result=document.createDocumentFragment();let matched=false;
      for(const n of source){
        if(n.nodeType===3){result.append(document.createTextNode(text(n.textContent,data)));continue}
        if(n.nodeType!==1)continue;
        const condition=a=>expr(n.getAttribute(a).replace(/^{{|}}$/g,''),data);
        if(n.hasAttribute('wx:if')){matched=!!condition('wx:if');if(!matched)continue}
        else if(n.hasAttribute('wx:elif')){if(matched)continue;matched=!!condition('wx:elif');if(!matched)continue}
        else if(n.hasAttribute('wx:else')){if(matched)continue;matched=true}
        else matched=false;
        if(n.hasAttribute('wx:for')){
          const values=condition('wx:for');values.forEach((item,index)=>{const clone=n.cloneNode(true);clone.removeAttribute('wx:for');result.append(nodes([clone],{...data,item,index}))});continue
        }
        if(n.tagName==='BLOCK'){result.append(nodes([...n.childNodes],data));continue}
        const target=document.createElement(n.tagName.toLowerCase());
        for(const a of n.attributes)if(!a.name.startsWith('wx:'))target.setAttribute(a.name,text(a.value,data));
        target.append(nodes([...n.childNodes],data));result.append(target);
      }return result;
    }
    function mount(id,source,data){const template=document.createElement('template');template.innerHTML=source;document.getElementById(id).replaceChildren(nodes([...template.content.childNodes],data))}
    window.show=(variant)=>{
      mount('stage',templates.skeleton,{variant,moving:true,label:'正在加载',rows:[0,1,2]});
      document.getElementById('caption').textContent=names[variant]+' · 首次等待时显示，数据就绪立即替换';
      document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===variant));
    };
    for(const [v,name]of Object.entries(names)){const b=document.createElement('button');b.dataset.variant=v;b.textContent=name;b.onclick=()=>show(v);document.getElementById('variants').append(b)}
    mount('feedback',templates.feedback,{busy:true,slow:false,top:0,moving:true});show('list');
    </script></html>
