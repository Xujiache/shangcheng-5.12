services:
  postgres:
    image: postgres:16-alpine
    container_name: jiujiu-postgres-production
    restart: unless-stopped
    environment:
      POSTGRES_USER: jiujiu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      POSTGRES_DB: jiujiu_mall
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_production:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jiujiu -d jiujiu_mall']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: jiujiu-redis-production
    restart: unless-stopped
    command: ['sh', '-c', 'redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the deployment environment}
    ports:
      - '127.0.0.1:6398:6379'
    volumes:
      - redis_production:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    container_name: jiujiu-minio-production
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the deployment environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the deployment environment}
    ports:
      - '127.0.0.1:9200:9000'
      - '127.0.0.1:9201:9001'
    volumes:
      - ../data/minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: jiujiu-minio-init-production
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the deployment environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the deployment environment}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
      /usr/bin/mc mb -p local/jiujiu-mall || true;
      /usr/bin/mc anonymous set download local/jiujiu-mall;
      exit 0;
      "

volumes:
  postgres_production:
  redis_production:
