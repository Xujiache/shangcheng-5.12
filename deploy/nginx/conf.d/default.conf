# 默认反向代理到后端 + WebSocket
upstream jiujiu_api {
  server server:3000;
}

server {
  listen 80;
  server_name _;

  # 后端 API
  # 平台 APK 可达 300 MB；仅对该受鉴权端点放宽全局 50 MB 限制。
  location = /api/v1/p/app-releases {
    client_max_body_size 300M;
    proxy_pass http://jiujiu_api/api/v1/p/app-releases;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://jiujiu_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Swagger 文档
  location /api/docs {
    proxy_pass http://jiujiu_api/api/docs;
    proxy_set_header Host $host;
  }

  # 在线客服 WebSocket
  location /ws/ {
    proxy_pass http://jiujiu_api/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400s;
  }

  # MinIO 随机 key 与 v1 缩略图均为不可变资源；浏览器和鸿蒙端可长期复用。
  location /oss/ {
    proxy_pass http://minio:9000/;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # 健康检查
  location /health {
    proxy_pass http://jiujiu_api/health;
    proxy_set_header Host $host;
  }

  # 默认页（后期可挂载 PC 端构建产物）
  location / {
    return 200 '{"service":"jiujiu-mall","status":"ok"}';
    add_header Content-Type application/json;
  }
}
